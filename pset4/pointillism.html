<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "grey";
    ctx.fillRect(0, 0, w, h);
     
     for(let circle = 0; circle <256; circle ++){
        let xPos = Math.random() * w;
        let yPos = Math.random() * h;
        let radius = Math.random() * 10;
        
        ctx.beginPath(); 
        ctx.arc(xPos,
            yPos,
            radius,
            0, 
            Math.PI * 2,
            false);

            let isAbove = yPos < 300;
            if (isAbove){
                ctx.fillStyle = "#EF998D";
            }
            else {
                ctx.fillStyle = "#F0AA75";
            }
        ctx.fill();

     }
</script>
